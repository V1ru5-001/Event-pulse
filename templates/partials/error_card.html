{# Shared body for the 404 / 403 pages. Expects: code, heading, message. #}
<div class="epx-authpage">
  <div class="epx-authcard" style="text-align:center;">

    <div class="epx-ticket"><span>Error {{ code }}</span><span>EP-{% now "y" %}</span></div>
    <div class="epx-perf"><span></span><span></span></div>

    <a href="/" class="epx-logo">EVENT<b>PULSE</b></a>
    <div class="epx-errcode">{{ code }}</div>
    <h1 class="epx-h1" style="font-size:2.2rem; margin-top:4px;">{{ heading }}</h1>
    <p style="color:var(--ink-soft); margin-top:12px; line-height:1.6;">{{ message }}</p>

    {% if user.is_authenticated %}
      <a href="{% url 'events:home' %}" class="epx-btn" style="width:100%; margin-top:28px;">Back to your feed</a>
    {% else %}
      <a href="{% url 'events:landing' %}" class="epx-btn" style="width:100%; margin-top:28px;">Go to EventPulse</a>
    {% endif %}
  </div>
</div>
